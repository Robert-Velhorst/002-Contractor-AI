# Optional addition to docker-compose.hosted.yml for a reviewed company handover.
services:
  contractor-ai:
    environment:
      CONTRACTOR_AI_AUTHORITY_KEY_FILE: /run/secrets/company_authority
    secrets:
      - company_authority
secrets:
  company_authority:
    file: ${CONTRACTOR_AI_AUTHORITY_KEY_HOST_FILE:?Set the private hosted environment key file outside the repository}
