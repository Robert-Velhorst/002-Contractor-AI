name: Publish Contractor.AI release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Verify release tag and main commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use semantic versioning (vMAJOR.MINOR.PATCH[-PRERELEASE])." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo "A release must target the current main commit." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  windows-package:
    needs: verify-release-source
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - run: npm run test:windows-package
      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path release/ContractorAI-windows-x64/* -DestinationPath release/ContractorAI-windows-x64.zip -Force
      - name: Attach Windows package to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/ContractorAI-windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber

  container-package:
    needs: verify-release-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish container package
        env:
          IMAGE: ${{ needs.verify-release-source.outputs.image }}
          RELEASE_TAG: ${{ needs.verify-release-source.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --sbom=true \
            --provenance=mode=max \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA::12}" \
            --push .
