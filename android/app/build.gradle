plugins { id 'com.android.application' }
def androidRuntime = new groovy.json.JsonSlurper().parse(rootProject.file('../android-runtime.json'))
android {
    namespace 'nl.contractorai.field'
    compileSdk {
        version = release(androidRuntime.android.major) {
            minorApiLevel = androidRuntime.android.minor
        }
    }
    buildToolsVersion androidRuntime.android.build_tools
    defaultConfig {
        applicationId 'nl.contractorai.field'
        minSdk 26
        targetSdk androidRuntime.android.major
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; manifestPlaceholders = [cleartext: 'true'] }
        release { minifyEnabled false; manifestPlaceholders = [cleartext: 'false'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
}
